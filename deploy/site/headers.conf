# Security headers for the statically exported marketing site
# (docs/audit/security-audit.md S15). nginx: include from the server{}
# block that serves site/out. Same set as _headers; HSTS applies only
# when this server terminates TLS (remove it behind a TLS proxy that
# already sets it). always => applies to error responses too.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
