# Example ClusterSecretStore for External Secrets Operator. Provisioned
# outside this chart (terraform module `secrets`). Placeholders only;
# pick ONE provider block. Authentication is via workload identity
# (IRSA / GKE WI / Vault k8s auth) — no static credentials in git.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kms-secret-store
spec:
  provider:
    # --- AWS Secrets Manager (KMS-encrypted) ---
    aws:
      service: SecretsManager
      region: eu-central-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
    # --- GCP Secret Manager (CMEK) ---
