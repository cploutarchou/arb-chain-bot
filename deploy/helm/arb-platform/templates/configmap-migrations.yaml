{{- if .Values.migrate.enabled }}
{{- $files := .Files.Glob "files/migrations/*.sql" }}
{{- if not $files }}
{{- fail "no migrations packaged: run deploy/helm/package.sh (copies ../../migrations into files/migrations) before helm install" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "arb.fullname" . }}-migrations
  labels:
    {{- include "arb.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
data:
{{ (.Files.Glob "files/migrations/*.sql").AsConfig | indent 2 }}
{{- end }}
