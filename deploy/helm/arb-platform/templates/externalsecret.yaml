{{- if .Values.externalSecrets.enabled }}
# External Secrets Operator (external-secrets.io) pulls credentials from
# a KMS-backed provider into a Kubernetes Secret. Nothing sensitive is in
# git; the ClusterSecretStore is provisioned by terraform. Example
# provider stanza for the store is in deploy/helm/arb-platform/examples/.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "arb.secretName" . }}
  labels:
    {{- include "arb.labels" . | nindent 4 }}
  annotations:
    # The migrate hook needs the Secret before the release installs.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeRef.name }}
    kind: {{ .Values.externalSecrets.storeRef.kind }}
  target:
    name: {{ include "arb.secretName" . }}
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    {{- $p := .Values.externalSecrets.remotePrefix }}
    {{- $keys := dict
          "ARB_SECRET_KEY" .Values.externalSecrets.keys.secretKey
          "ARB_ADMIN_EMAIL" .Values.externalSecrets.keys.adminEmail
          "ARB_ADMIN_PASSWORD" .Values.externalSecrets.keys.adminPassword
          "ARB_TELEGRAM_TOKEN" .Values.externalSecrets.keys.telegramToken
          "ARB_TELEGRAM_ALLOWLIST" .Values.externalSecrets.keys.telegramAllowlist }}
    {{- /* The DSN is projected only while persistence is on. A canary
           reads its own key ("arb.databaseRemoteKey"), never the primary's. */}}
    {{- if .Values.arbd.persistence.enabled }}
    {{- $_ := set $keys "ARB_DATABASE_URL" (include "arb.databaseRemoteKey" .) }}
    {{- end }}
    {{- range $env, $key := $keys }}
    - secretKey: {{ $env }}
      remoteRef:
        key: {{ printf "%s%s" $p $key | quote }}
    {{- end }}
{{- end }}
