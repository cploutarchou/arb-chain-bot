apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbackrest-config
  namespace: arb
data:
  pgbackrest.conf: |
    [global]
    repo1-type=s3
    repo1-path=/pgbackrest
    repo1-s3-bucket=REPLACE_BACKUPS_BUCKET          # terraform output backups_bucket
    repo1-s3-endpoint=s3.eu-central-1.amazonaws.com
    repo1-s3-region=eu-central-1
    repo1-s3-key-type=web-id                        # workload identity; no static keys
    repo1-retention-full=8
    repo1-retention-diff=14
    repo1-retention-archive=14
    repo1-cipher-type=none                          # bucket is KMS-encrypted server side
    process-max=4
    compress-type=zst
    log-level-console=info
    start-fast=y
    archive-async=y
    spool-path=/spool

    [arb]
    pg1-host=REPLACE_POSTGRES_ENDPOINT              # terraform output postgres_endpoint
    pg1-port=5432
    pg1-database=arb
    pg1-user=arb_backup                             # replication+backup role, read-only
    pg1-path=/var/lib/postgresql/data               # informational for managed services
