# Backup role password, delivered from the KMS-backed store. The backup
# role has REPLICATION + pg_read_all_data only; it cannot read the
# secrets table's decrypted contents (those are encrypted with
# ARB_SECRET_KEY, which pgBackRest never sees).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pgbackrest-credentials
  namespace: arb
spec:
  refreshInterval: 1h
  secretStoreRef: {name: kms-secret-store, kind: ClusterSecretStore}
  target:
    name: pgbackrest-credentials
    creationPolicy: Owner
  data:
    - secretKey: PGPASSWORD
      remoteRef: {key: "arb/prod/pg-backup-password"}
    - secretKey: PGADMIN_URL
      remoteRef: {key: "arb/prod/database-url-admin"}
