name: Site

on:
  push:
    branches: [master, main]
    paths:
      - "site/**"
      - "docs/site/**"
      - "docs/user-guide/**"
      - "docs/campaigns/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/site/**"
      - "docs/user-guide/**"
      - "docs/campaigns/**"
      - ".github/workflows/site.yml"

permissions:
  contents: read

jobs:
  site:
    name: Marketing site (Next.js static export)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: install
        run: npm ci
      - name: audit (fail on high)
        run: npm audit --audit-level=high
      - name: test
        run: npm test
      - name: lint
        run: npm run lint
      - name: typecheck
        run: npm run typecheck
      - name: copy-lint
        run: npm run copy-lint
      - name: build
        run: npm run build
      - name: upload static export
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-out
          path: site/out
          retention-days: 7
