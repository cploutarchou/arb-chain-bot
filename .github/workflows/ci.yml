name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read
  # gitleaks-action reads the PR's commit list to scope its scan.
  pull-requests: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arb
          POSTGRES_PASSWORD: arb
          POSTGRES_DB: arb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arb -d arb"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          out=$(gofmt -l cmd internal)
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: apply migrations
        run: |
          for f in migrations/*.up.sql; do
            PGPASSWORD=arb psql -h localhost -U arb -d arb -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: go test (race)
        env:
          ARB_TEST_DATABASE_URL: postgres://arb:arb@localhost:5432/arb?sslmode=disable
          # The storage integration tests DELETE most of the schema and
          # refuse to run without this. The service container above is
          # created and thrown away per job, so it is disposable.
          ARB_TEST_DB_DESTRUCTIVE: "1"
        run: go test -race ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.5

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install
        run: npm ci
      - name: audit (fail on high)
        run: npm audit --audit-level=high
      - name: lint
        run: npm run lint
      - name: typecheck
        run: npm run typecheck
      - name: build
        run: npm run build

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: E2E (Playwright, real backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install frontend deps
        working-directory: web
        run: npm ci
      - name: install playwright chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: run e2e suite
        run: ./scripts/e2e.sh
