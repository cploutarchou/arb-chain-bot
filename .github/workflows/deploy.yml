# Build once on tag, promote the same image digests through paper-test
# (automatic) and prod (manual approval, canary 10% -> full) with
# automatic rollback on failed smoke tests or SLO burn alerts.
#
# Secrets: none in this file. Cloud + cluster access is via GitHub OIDC
# (id-token: write) assuming per-environment roles configured as
# repository *variables* (vars.*), not secrets. Application secrets
# reach pods only through External Secrets (KMS store).
#
# LIVE execution is disabled in every environment by code; this pipeline
# cannot enable it (values files pin ARB_MODE=PAPER, the chart rejects
# anything else, and the binary has no LIVE mode).
name: Deploy

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)promote"
        required: true

permissions:
  contents: read
  packages: write
  id-token: write        # OIDC to cloud / cluster

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_ARBD: ghcr.io/${{ github.repository }}/arbd
  IMAGE_WEB: ghcr.io/${{ github.repository }}/web
  HELM_VERSION: v3.16.2
  RELEASE: arb
  NAMESPACE: arb

jobs:
  # --------------------------------------------------------------------
  build:
    name: Build once, push by digest
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      arbd_digest: ${{ steps.arbd.outputs.digest }}
      web_digest: ${{ steps.web.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: meta
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}     # ephemeral, GitHub-issued
      - name: build+push arbd
        id: arbd
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: true
          sbom: true
          tags: ${{ env.IMAGE_ARBD }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: build+push web
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/web.Dockerfile
          push: true
          provenance: true
          sbom: true
          tags: ${{ env.IMAGE_WEB }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: scan images (fail on critical)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_ARBD }}@${{ steps.arbd.outputs.digest }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: sign images (keyless, OIDC)
        uses: sigstore/cosign-installer@v3
      - run: |
          cosign sign --yes "${IMAGE_ARBD}@${{ steps.arbd.outputs.digest }}"
          cosign sign --yes "${IMAGE_WEB}@${{ steps.web.outputs.digest }}"

  chart:
    name: Lint + package chart
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.tag }}
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - run: deploy/helm/package.sh dist
      - run: |
          for v in dev paper-test prod; do
            helm template arb deploy/helm/arb-platform -f deploy/helm/arb-platform/values-$v.yaml > /dev/null
          done
          # negative guard: LIVE must be rejected by the chart
          if helm template arb deploy/helm/arb-platform --set arbd.mode=LIVE >/dev/null 2>&1; then
            echo "chart accepted arbd.mode=LIVE"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: chart
          path: dist/*.tgz

  # --------------------------------------------------------------------
  paper-test:
    name: Deploy paper-test
    runs-on: ubuntu-latest
    needs: [build, chart]
    environment:
      name: paper-test
      url: https://paper.console.example.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.tag }}
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: cloud auth (OIDC placeholder)
        # Replace with the provider action, e.g.
        #   aws-actions/configure-aws-credentials@v4 with role-to-assume: ${{ vars.PAPER_TEST_DEPLOY_ROLE }}
        #   google-github-actions/auth@v2 with workload_identity_provider / service_account
        run: |
          echo "assume ${{ vars.PAPER_TEST_DEPLOY_ROLE }} via OIDC; write kubeconfig for ${{ vars.PAPER_TEST_CLUSTER }}"
          echo "::notice::placeholder — no credentials in this workflow"
      - name: helm upgrade (atomic)
        run: |
          deploy/helm/package.sh >/dev/null
          helm upgrade --install "$RELEASE" deploy/helm/arb-platform \
            -n "$NAMESPACE" --create-namespace --atomic --timeout 10m \
            -f deploy/helm/arb-platform/values-paper-test.yaml \
            --set image.arbd.digest="${{ needs.build.outputs.arbd_digest }}" \
            --set image.web.digest="${{ needs.build.outputs.web_digest }}" \
            --set-string image.arbd.tag="${{ needs.build.outputs.tag }}" \
            --set-string image.web.tag="${{ needs.build.outputs.tag }}"
      - name: smoke test
        run: deploy/scripts/smoke.sh "$NAMESPACE" "$RELEASE"
      - name: rollback on smoke failure
        if: failure()
        run: helm -n "$NAMESPACE" rollback "$RELEASE" --wait --timeout 5m || true

  # --------------------------------------------------------------------
  prod-approval:
    name: Manual approval gate (prod)
    runs-on: ubuntu-latest
    needs: paper-test
    environment:
      name: prod-approval          # required reviewers configured in repo settings
    steps:
      - run: echo "approved ${{ needs.build.outputs.tag }} for prod canary"

  prod-canary:
    name: Prod canary (10%)
    runs-on: ubuntu-latest
    needs: [build, prod-approval]
    environment:
      name: prod
      url: https://console.example.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.tag }}
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: cloud auth (OIDC placeholder)
        run: echo "assume ${{ vars.PROD_DEPLOY_ROLE }} via OIDC; kubeconfig for ${{ vars.PROD_CLUSTER }}"
      - name: record previous revision
        run: |
          helm -n "$NAMESPACE" history "$RELEASE" -o json | jq -r '.[-1].revision' > prev-rev.txt || echo 0 > prev-rev.txt
          echo "previous revision: $(cat prev-rev.txt)"
      - name: canary release (web 10% via separate release + ingress canary annotations)
        # arbd is single-writer; the canary is the stateless web tier
        # plus a shadow arbd in REPLAY mode against the latest recording.
        # Full arbd cut-over happens in prod-full after the bake.
        run: |
          deploy/helm/package.sh >/dev/null
          helm upgrade --install "$RELEASE-canary" deploy/helm/arb-platform \
            -n "$NAMESPACE" --atomic --timeout 10m \
            -f deploy/helm/arb-platform/values-prod.yaml \
            -f deploy/helm/canary-values.yaml \
            --set image.arbd.digest="${{ needs.build.outputs.arbd_digest }}" \
            --set image.web.digest="${{ needs.build.outputs.web_digest }}"
      - name: smoke + bake 15m against SLO alerts
        run: |
          deploy/scripts/smoke.sh "$NAMESPACE" "$RELEASE-canary"
          deploy/scripts/bake.sh "${{ vars.PROD_ALERTMANAGER_URL }}" 900 \
            'APIAvailabilityBurnFast|FeedStale|PodCrashLooping|MigrateJobFailed|ArbdNotReady'
      - name: rollback canary on failure
        if: failure()
        run: helm -n "$NAMESPACE" uninstall "$RELEASE-canary" --wait || true

  prod-full:
    name: Prod full rollout
    runs-on: ubuntu-latest
    needs: [build, prod-canary]
    environment:
      name: prod
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.tag }}
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: cloud auth (OIDC placeholder)
        run: echo "assume ${{ vars.PROD_DEPLOY_ROLE }} via OIDC"
      - name: full upgrade (atomic, migrate hook runs first)
        run: |
          deploy/helm/package.sh >/dev/null
          helm upgrade --install "$RELEASE" deploy/helm/arb-platform \
            -n "$NAMESPACE" --atomic --timeout 15m \
            -f deploy/helm/arb-platform/values-prod.yaml \
            --set image.arbd.digest="${{ needs.build.outputs.arbd_digest }}" \
            --set image.web.digest="${{ needs.build.outputs.web_digest }}" \
            --set-string image.arbd.tag="${{ needs.build.outputs.tag }}" \
            --set-string image.web.tag="${{ needs.build.outputs.tag }}"
      - name: smoke + 10m bake
        run: |
          deploy/scripts/smoke.sh "$NAMESPACE" "$RELEASE"
          deploy/scripts/bake.sh "${{ vars.PROD_ALERTMANAGER_URL }}" 600 \
            'APIAvailabilityBurnFast|FeedStale|PodCrashLooping|ArbdNotReady|RecorderDroppedFrames'
      - name: remove canary
        run: helm -n "$NAMESPACE" uninstall "$RELEASE-canary" --wait || true
      - name: automatic rollback
        if: failure()
        run: |
          echo "::error::smoke/bake failed — rolling back $RELEASE"
          helm -n "$NAMESPACE" rollback "$RELEASE" --wait --timeout 10m
          deploy/scripts/smoke.sh "$NAMESPACE" "$RELEASE"
